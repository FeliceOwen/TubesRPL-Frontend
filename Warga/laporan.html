<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard SiapSiaga</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <style>
            .hidden {
                display: none;
            }
            header {
                background-color: #626F47;
                color: #F5ECD5;
                margin : 0;
                padding : 10px;            
                font-weight: bold;
                font-size: 40px;
                position: sticky;
            }
            body {
                font-family: 'Inter', sans-serif;
                margin : 0;
                main {
                    margin: 20px;
                    h1 {
                        display: inline;
                        margin-right: 20px;
                    }
                    a#perbarui-laporan {
                        font-weight: bold;
                        background-color: #626F47;
                        color : white;
                        border-radius: 10px;
                        padding: 10px;
                        margin-top: 20px;
                        padding-left: 20px;
                        padding-right: 20px;
                        text-decoration: none;
                    }
                    .card-laporan {
                        background-color: #F5ECD5;
                        border-radius: 10px;
                        padding: 10px;
                        margin-top : 20px;
                        #header-laporan {
                            margin: 0;
                            display: flex;
                            flex-direction: row;
                            justify-content: space-between;
                            align-items: center;
                            p:nth-child(1) {
                                margin: 0;
                                color: #626F47;
                                font-weight: bold;
                                font-size: 30px;
                            }
                        }
                        span#header-laporan ~ span {
                            display: flex;
                            align-items: center;
                            h3 {
                                width: 100px;
                                margin: 0;
                            }
                        }
                        .log-pembaruan {
                            display: flex;
                            align-items: center;
                            p:nth-child(1) {
                                width: 100px;
                                margin: 0;
                            }
                        }
                        div#action-laporan {
                            margin-top: 10px;
                            display: flex;
                            flex-direction: row;
                            justify-content: center;
                            gap: 10px;
                            #delete-btn {
                                background: none;
                                border: none;
                                margin: 0;
                                margin-top: 4px;
                            }
                            a#perbarui-laporan {
                                margin: 0;
                            }
                        }
                        
                    }
                }
            }
            
            nav {
                background-color: #F5ECD5;
                display: flex;
                justify-content: space-evenly;
                position: fixed;
                align-items: center;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 10px;
                box-sizing: border-box;
                height: 60px;
            }

            .grey-filter {
                filter: grayscale(100%);
            }
        </style>

        <script defer>
            const trash_icon = document.querySelector("#delete-btn");
            const body = document.querySelector("body");
            trash_icon.addEventListener("click", function() {
                body.classList.add("grey-filter");
            });
        </script>
    </head>
    <body>
        <header>SiapSiaga</header>
        <main>
            <h1>Laporan Saya</h1>
            <select id="filter-status">
                <option value="">Filter Status</option>
                <!-- to do : harus dari database ga-->
            </select>

            <div class="card" th:each="laporan : ${laporanList}">
                <div class="card-laporan ">
                    <span id="header-laporan">
                        <p id="jenis-laporan" th:text="${laporan.jenis}">Bencana</p>
                        <p th:text="${laporan.status}">Status</p>
                    </span>
                    
                    <span id="lokasi">
                        <h3>Lokasi</h3>
                        <p th:text="${laporan.lokasi}">lokasi</p>
                    </span>
                    <span id="tanggal">
                        <h3>Tanggal</h3>
                        <p th:text="${laporan.tanggal}">tanggal</p>
                    </span>
                    <span id="jam">
                        <h3>Jam</h3>
                        <p th:text="${laporan.jam}">jam</p>
                    </span>
                    <span id="catatan">
                        <h3>Catatan</h3>
                        <p th:text="${laporan.catatan}">catatan</p>
                    </span>
                    <div id="pembaruan" class="hidden">
                        <h3>Pembaruan</h3>
                        <div class="log-pembaruan" th:each="pembaruan : ${pembaruanList}">
                            <p th:text="${waktu-pembaruan}">waktu</p>
                            <p th:text="${isi-pembaruan}">isi pembaruan</p>
                        </div>
                    </div>
                    <div id="foto-kejadian">
                        <h3>Foto Kejadian</h3>
                        <img th:src="@{'/assets/' + ${laporan.gambar}}" alt="gambar-laporan">
                    </div>
                    <div id="action-laporan">
                        <a id="perbarui-laporan" href="perbarui_laporan.html">Perbarui Laporan</a>
                        <a id="delete-btn">
                            <img src="../assets/delete-red.png" alt="delete-btn">
                        </a>
                    </div>
                    
                </div>
            </div>
        </main>
        
           
        <nav>
            <a href="index.html">
                <img src="../assets/home-black.png" value="dashboard">
            </a>
            <a href="laporan.html">
                <img src="../assets/report-green.png" value="laporan">
            </a>
            <a href="profil.html">
                <img src="../assets/profile-black.png" value="profil">
            </a>
        </nav>
    </body>
</html>
