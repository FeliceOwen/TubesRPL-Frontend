<!DOCTYPE html>
<html>
    <head>
        <title>Dashboard SiapSiaga</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <style>
            .hidden {
                display: none !important;
            }
            header {
                background-color: #626F47;
                color: #F5ECD5;
                margin : 0;
                padding : 10px;            
                font-weight: bold;
                font-size: 40px;
                position: sticky;
            }
            body {
                font-family: 'Inter', sans-serif;
                margin : 0;
                main {
                    margin: 20px;
                    h1 {
                        display: inline;
                        margin-right: 20px;
                    }
                    a#perbarui-laporan {
                        font-weight: bold;
                        background-color: #626F47;
                        color : white;
                        border-radius: 10px;
                        padding: 10px;
                        margin-top: 20px;
                        padding-left: 20px;
                        padding-right: 20px;
                        text-decoration: none;
                    }
                    .card-laporan {
                        background-color: #F5ECD5;
                        border-radius: 10px;
                        padding: 10px;
                        margin-top : 20px;
                        #header-laporan {
                            margin: 0;
                            display: flex;
                            flex-direction: row;
                            justify-content: space-between;
                            align-items: center;
                            p:nth-child(1) {
                                margin: 0;
                                color: #626F47;
                                font-weight: bold;
                                font-size: 30px;
                            }
                            #status-laporan[data-status="Terverifikasi"] {color: green;}
                            #status-laporan[data-status="Menunggu Verifikasi"] {color: yellow;}
                            #status-laporan[data-status="Tidak Terverifikasi"] {color: red;}
                        }
                        span#header-laporan ~ span {
                            display: flex;
                            align-items: center;
                            h3 {
                                width: 100px;
                                margin: 0;
                            }
                        }
                        .log-pembaruan {
                            display: flex;
                            align-items: center;
                            p:nth-child(1) {
                                width: 100px;
                                margin: 0;
                            }
                        }
                        div#action-laporan {
                            margin-top: 10px;
                            display: flex;
                            flex-direction: row;
                            justify-content: center;
                            gap: 10px;
                            #delete-btn {
                                background: none;
                                border: none;
                                margin: 0;
                                margin-top: 4px;
                            }
                            a#perbarui-laporan {
                                margin: 0;
                            }
                            .disable-btn {
                                pointer-events: none;
                                filter: grayscale(100%);
                                cursor: not-allowed;
                            }
                        }
                        
                    }
                }
            }
            
            nav {
                background-color: #F5ECD5;
                display: flex;
                justify-content: space-evenly;
                position: fixed;
                align-items: center;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 10px;
                box-sizing: border-box;
                height: 60px;
            }

            #grey-filter {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 10;
            }

            #konfirmasi-hapus {
                display: flex;
                background-color: white;
                position: fixed;
                top: 40%;
                margin: 10px;
                justify-content: center;
                flex-direction: column;
                align-items: center;
                border-radius: 20px;
                gap: 0;
                padding: 10px;
                z-index: 20;
                h2 {
                    margin: 0;
                }
                p {
                    margin: 0;
                }
                #action-konfirmasi {
                    margin-top: 30px;
                    margin-bottom: 20px;
                    a {
                        border-radius: 20px;
                        padding: 10px;
                        margin: 10px;
                        color: white;
                        font-weight: bold;
                    }
                    a:nth-child(1) {
                        background-color: gray;
                    }
                    a:nth-child(2) {
                        background-color: red;
                    }
                }
            }

            .hidden {
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="grey-filter" class="hidden"></div>
        <div id="page">
            <header>SiapSiaga</header>
            <main>
                <h1>Laporan Saya</h1>
                <select id="filter-status">
                    <option value="">Filter Status</option>
                    <!-- to do : harus dari database ga-->
                </select>

                <div class="card" th:each="laporan : ${laporanList}" th:data-id="${laporan.id}">
                    <div class="card-laporan ">
                        <span id="header-laporan">
                            <p id="jenis-laporan" th:text="${laporan.jenis}">Bencana</p>
                            <p id="status-laporan" th:data-status="${laporan.status}" th:text="${laporan.status}">Status</p>
                        </span>
                        
                        <span id="lokasi">
                            <h3>Lokasi</h3>
                            <p th:text="${laporan.lokasi}">lokasi</p>
                        </span>
                        <span id="tanggal">
                            <h3>Tanggal</h3>
                            <p th:text="${laporan.tanggal}">tanggal</p>
                        </span>
                        <span id="jam">
                            <h3>Jam</h3>
                            <p th:text="${laporan.jam}">jam</p>
                        </span>
                        <span id="catatan">
                            <h3>Catatan</h3>
                            <p th:text="${laporan.catatan}">catatan</p>
                        </span>
                        <div id="pembaruan" class="hidden">
                            <h3>Pembaruan</h3>
                            <div class="log-pembaruan" th:each="pembaruan : ${pembaruanList}">
                                <p th:text="${waktu-pembaruan}">waktu</p>
                                <p th:text="${isi-pembaruan}">isi pembaruan</p>
                            </div>
                        </div>
                        <div id="foto-kejadian">
                            <h3>Foto Kejadian</h3>
                            <img th:src="@{'/assets/' + ${laporan.gambar}}" alt="gambar-laporan">
                        </div>
                        <div id="action-laporan">
                            <a id="perbarui-laporan" href="perbarui_laporan.html">Perbarui Laporan</a>
                            <a id="delete-btn" 
                               th:data-id="${laporan.id}" 
                               th:classappend="${laporan.status == 'Terverifikasi'} ? 'disabled-btn' : ''">
                                <img src="../assets/delete-red.png" alt="delete-btn">
                            </a>
                        </div>
                        
                    </div>
                </div>
            </main>
            
            <nav>
                <a href="index.html">
                    <img src="../assets/home-black.png" value="dashboard">
                </a>
                <a href="laporan.html">
                    <img src="../assets/report-green.png" value="laporan">
                </a>
                <a href="profil.html">
                    <img src="../assets/profile-black.png" value="profil">
                </a>
            </nav>
        </div>
        <div  class="hidden" id="konfirmasi-hapus">
            <h2>Konfirmasi Hapus</h2>
            <p>Yakin ingin menghapus laporan berikut?</p>
            <p>Data yang dihapus tidak dapat dikembalikan.</p>

            <span id="action-konfirmasi">
                <a>Batalkan</a>
                <a>Hapus</a>
            </span>
        </div>

        <script >
            const trash_icon = document.querySelector("#delete-btn");
            const grey = document.querySelector("#grey-filter");
            const konfirmasi = document.querySelector("#konfirmasi-hapus");
            trash_icon.addEventListener("click", function() {
                grey.classList.remove("hidden");
                konfirmasi.classList.remove("hidden");
                action_konfirmasi();
            });

            function action_konfirmasi() {
                const action_konfirmasi = document.querySelector("#action-konfirmasi");
                const button_batalkan = action_konfirmasi.querySelector("a:nth-child(1)");
                const button_hapus = action_konfirmasi.querySelector("a:nth-child(2)");

                button_batalkan.addEventListener("click", function() {
                    grey.classList.add("hidden");
                    konfirmasi.classList.add("hidden");
                });

                button_hapus.addEventListener("click", function() {
                    // to do : urus hapus laporan
                });
            }

        </script>
    </body>
</html>
