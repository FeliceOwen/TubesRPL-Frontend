<!DOCTYPE html>
<html>
    <head>
        <title>Perbarui Laporan</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <style>
            body {
                margin: 20px;
                font-family: 'Inter', sans-serif;
                header {
                    display: flex;
                    a {
                        margin-top: 5px;
                    }
                    h1 {
                        margin: 0;
                        margin-left: 10px;
                        font-weight: bold;
                        font-size: 25px;
                    }
                }
                .card-laporan {
                    background-color: #F5ECD5;
                    border-radius: 10px;
                    padding: 10px;
                    margin-top : 20px;
                    #header-laporan {
                        margin: 0;
                        display: flex;
                        flex-direction: row;
                        justify-content: space-between;
                        align-items: center;
                        p:nth-child(1) {
                            margin: 0;
                            color: #626F47;
                            font-weight: bold;
                            font-size: 30px;
                        }
                    }
                    span#header-laporan ~ span {
                        display: flex;
                        align-items: center;
                        h3 {
                            width: 100px;
                            margin: 0;
                        }
                    }
                    .log-pembaruan {
                        display: flex;
                        align-items: center;
                        p:nth-child(1) {
                            width: 100px;
                            margin: 0;
                        }
                    }                
                }
                form {
                    background-color: #F5ECD5;
                    border-radius: 10px;
                    padding: 10px;
                    padding-top: 1px;
                    box-sizing: border-box;
                    display: flex;
                    flex-direction: column;
                    width: 100%;
                    margin-top: 20px;

                    p:nth-child(1) {
                        margin: 10px 0;
                        color: #626F47;
                        font-weight: bold;
                        font-size: 30px;
                    }

                    span{
                        display: flex;
                        margin-bottom: 10px;
                        justify-content: space-between;
                        textarea {
                            width: 50%;
                            box-sizing: border-box;
                            height : 70px;
                        }
                        label {
                            font-weight: bold;
                        }
                    }
                    span#foto  {
                        input {
                            margin-left: 110px;
                        }
                    }

                    a {
                        margin-top: 20px;
                        margin-bottom: 10px;
                        font-size: 17px;
                        background-color: #626F47;
                        padding: 10px;
                        border-radius: 15px;
                        font-weight: bold;

                        box-sizing: border-box;
                        text-align: center;
                        text-decoration: none;
                        color: white;
                        
                    }
                }
            }
        </style>
    </head>
    <body>
        <header>
            <a href="laporan.html">
                <img src="../assets/back-black.png" value="back">
            </a>
            <h1>Perbarui Laporan Anda</h1>
        </header>
        <p>Laporkan kejadian bencana terkini seperti gempa susulan dan kondisi terkini.</p>
        <main>
            <div class="card" th:each="laporan : ${laporanList}" th:data-id="${laporan.id}">
                <div class="card-laporan ">
                    <span id="header-laporan">
                        <p id="jenis-laporan" th:text="${laporan.jenis}">Bencana</p>
                        <p th:text="${laporan.status}">Status</p>
                    </span>
                    
                    <span id="lokasi">
                        <h3>Lokasi</h3>
                        <p th:text="${laporan.lokasi}">lokasi</p>
                    </span>
                    <span id="tanggal">
                        <h3>Tanggal</h3>
                        <p th:text="${laporan.tanggal}">tanggal</p>
                    </span>
                    <span id="jam">
                        <h3>Jam</h3>
                        <p th:text="${laporan.jam}">jam</p>
                    </span>
                    <span id="catatan">
                        <h3>Catatan</h3>
                        <p th:text="${laporan.catatan}">catatan</p>
                    </span>
                    <div id="pembaruan" class="hidden">
                        <h3>Pembaruan</h3>
                        <div class="log-pembaruan" th:each="pembaruan : ${pembaruanList}">
                            <p th:text="${waktu-pembaruan}">waktu</p>
                            <p th:text="${isi-pembaruan}">isi pembaruan</p>
                        </div>
                    </div>
                    <div id="foto-kejadian">
                        <h3>Foto Kejadian</h3>
                        <img th:src="@{'/assets/' + ${laporan.gambar}}" alt="gambar-laporan">
                    </div>
                </div>
            </div>

            <!-- to do : action form -->
            <form method="post">
                <p>Pembaruan</p>
                <span id="tanggal">
                    <label>Tanggal Kejadian</label>
                    <input type="date" id="input-tanggal">
                </span>
                <span id="waktu">
                    <label>Waktu Kejadian</label>
                    <input type="time" id="input-waktu">
                </span>
                <span id="foto">
                    <label>Foto</label>
                    <input type="file" id="input-foto">
                </span>
                <span id="catatan">
                    <label>Catatan</label>
                    <textarea id="input-tanggal">Tambah catatan kejadian laporan terbaru</textarea>
                </span>
                <!-- to do : kirim kemana -->
                <a id="perbarui-laporan" href="konfirmasi_perbarui.html">
                    Perbarui Laporan
                </a>
            </form>
        </main>
    </body>
</html>
